<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Archivo</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: linear-gradient(120deg, #0078d4 0%, #00c6fb 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #fff;
            padding: 2.5rem 3.5rem;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 340px;
        }
        h2 {
            margin-bottom: 2rem;
            color: #0078d4;
            font-weight: 700;
            letter-spacing: 1px;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input[type="file"] {
            margin-bottom: 1.5rem;
            padding: 0.5rem;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #f9f9f9;
            width: 100%;
            font-size: 1rem;
        }
        button {
            background: linear-gradient(90deg, #0078d4 0%, #00c6fb 100%);
            color: #fff;
            border: none;
            padding: 0.7rem 2.2rem;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,120,212,0.08);
            transition: background 0.2s, transform 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #005fa3 0%, #00a6d4 100%);
            transform: translateY(-2px) scale(1.03);
        }
        #status {
            margin-top: 1.2rem;
            color: #0078d4;
            font-size: 1.05rem;
            min-height: 1.5em;
            text-align: center;
        }
        @media (max-width: 500px) {
            .container {
                padding: 1.2rem 0.5rem;
                min-width: 90vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cargar un archivo</h2>
        <form id="uploadForm" action="upload.php" method="post" enctype="multipart/form-data">
            <input type="file" name="fileInput" id="fileInput" required /> <br>
            <button type="submit">Subir</button>
        </form>
        <div id="status"></div>
    </div>
    <script>
        // Opcional: mostrar el nombre del archivo seleccionado
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const status = document.getElementById('status');
            if (this.files.length) {
                status.textContent = `Archivo seleccionado: ${this.files[0].name}`;
            } else {
                status.textContent = '';
            }
        });
    </script>
</body>
</html>
