# ─── Conexión al servidor Moodle real ──────────────────────────────────────
# Reemplaza estos valores con los datos de tu servidor Moodle existente.
# El usuario de DB debe tener permisos SELECT sobre mdl_logstore_standard_log.
moodle:
  # Apuntando al Moodle REAL de prueba (moodle-docker, ver moodle_test_env/),
  # usado para validar el sistema contra un EVA autentico en vez de datos
  # sinteticos. El prefijo de tablas de esta instancia es "m_" (definido en
  # moodle_test_env/moodle-docker/config.docker-template.php), no "mdl_" -
  # por eso log_table difiere del valor por defecto de un Moodle tipico.
  host: "127.0.0.1"                # host del contenedor MariaDB de moodle-docker
  port: 3307
  database: "moodle"              # nombre de la base de datos Moodle
  user: "moodle_reader"           # usuario de solo lectura creado para este sistema
  password: "ReaderPass123!"      # ver GRANT SELECT en moodle_test_env
  log_table: "m_logstore_standard_log"
  poll_interval_seconds: 10       # frecuencia de consulta en segundos
  extraction_mode: "polling"       # modo de extraccion: "polling" o "cdc_triggers"

# ─── Redis Streams (broker de mensajería) ──────────────────────────────────
# Instalación con Docker: docker compose up -d redis
# O instalación directa: https://redis.io/docs/getting-started/
redis:
  host: "localhost"               # IP del servidor Redis
  port: 6379
  stream_name: "moodle_logs"      # stream de eventos crudos
  consumer_group: "anomaly_detectors"
  consumer_name: "detector_1"
  max_len: 100000                 # máxima longitud del stream (descarte circular)

# ─── InfluxDB + Grafana ────────────────────────────────────────────────────
# Token por defecto del docker-compose.yml incluido.
# Si usas InfluxDB externo, actualiza url y token.
# Para generar un nuevo token: python scripts/setup_influxdb.py
influxdb:
  url: "http://localhost:8086"
  token: "moodle-influx-token-2024"   # token del docker-compose (cámbialo en producción)
  org: "UCI"
  bucket: "moodle_metrics"
  # Bucket separado para el analisis bajo demanda de un dataset proporcionado
  # (scripts/analyze_dataset.py), para no mezclarlo con el monitoreo en vivo.
  batch_bucket: "moodle_batch_analysis"

preprocessing:
  aggregation_window_seconds: 60  # ventana de agregacion temporal
  series_features:
    - "request_count"
    - "unique_users"
    - "error_count"
    - "avg_response_time"

models:
  arima:
    order: [2, 1, 2]              # (p, d, q)
    seasonal_order: [1, 1, 1, 24] # (P, D, Q, s) - estacionalidad de 24 periodos
    retrain_interval_hours: 6
  lstm:
    sequence_length: 60           # ventana de 60 periodos anteriores
    hidden_units: 64
    dropout: 0.2
    epochs: 20
    batch_size: 32
    retrain_interval_hours: 12
  anomaly_detector:
    contamination: 0.05           # proporcion esperada de anomalias (5%)
    n_estimators: 100

# ─── Sistema de Alertas Activas ──────────────────────────────────────────────
alerts:
  cooldown_minutes: 5             # tiempo minimo entre alertas del mismo tipo
  channels:
    # Canal de email via SMTP
    email:
      enabled: false              # cambiar a true para activar
      smtp_host: "smtp.uci.cu"
      smtp_port: 587
      sender: "monitor@uci.cu"
      recipients:
        - "admin@uci.cu"
    # Canal de Webhook HTTP generico
    webhook:
      enabled: false             # cambiar a true para activar
      url: "https://your-webhook-endpoint.com/alert"
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer YOUR_TOKEN_HERE"
    # Canal de Slack via Incoming Webhook
    slack:
      enabled: false             # cambiar a true para activar
      webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
    # Canal de log local
    log:
      enabled: true
      file: "logs/alerts.log"

# ─── Detección de Concept Drift ───────────────────────────────────────────────
drift_detection:
  enabled: true                   # activar deteccion de concept drift
  page_hinkley:
    alpha: 0.5                    # decaying factor
    threshold: 50                 # change threshold
    delta: 0.005                 # drift magnitude
  adwin:
    enabled: true
    widths: [30, 60, 100]        # window sizes para ADWIN

# ─── API REST Server ────────────────────────────────────────────────────────
api_server:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  debug: false
  auth:
    user: "admin"
    password: "admin"            # cambiar en produccion!
    enabled: true

# ─── Fusion Adaptativa ───────────────────────────────────────────────────────
adaptive_fusion:
  enabled: false                 # activar fusion adaptativa (desactivado: usa AnomalyDetector.fuse(), score continuo validado, umbral 0.58)
  min_weight: 0.1
  max_weight: 2.0
  performance_window: 100         # numero de detecciones para recalcular pesos
  initial_weights:
    isolation_forest: 1.0
    arima: 0.8
    lstm: 1.2

academic_calendar:
  file: "config/academic_calendar.json"